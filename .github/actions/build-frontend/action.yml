name: 'Build Frontend (Angular)'
description: 'Build the Angular frontend project with optional testing and GitHub Pages deployment'

inputs:
  node-version:
    description: 'Node.js version to install'
    required: false
    default: '22'

  configuration:
    description: 'Angular build configuration'
    required: false
    default: 'production'

  run-tests:
    description: 'Whether to run unit tests before building'
    required: false
    default: 'false'

  publish:
    description: 'Whether to upload the build output to GitHub Pages'
    required: false
    default: 'false'

  base-href:
    description: 'Base href for Angular deployment'
    required: false
    default: '/'

runs:
  using: composite

  steps:
    - name: Setup Frontend
      uses: ./.github/actions/setup-frontend
      with:
        node-version: ${{ inputs.node-version }}

    - name: Run Unit Tests
      if: inputs.run-tests == 'true'
      shell: bash
      working-directory: frontend/bds-admin-ui
      run: npx ng test --watch=false

    - name: Lint Check
      if: inputs.run-tests == 'true'
      shell: bash
      working-directory: frontend/bds-admin-ui
      run: npx prettier --check "src/**/*.{ts,html,scss}"

    - name: Build Frontend
      shell: bash
      working-directory: frontend/bds-admin-ui
      run: |
        npx ng build \
          --configuration ${{ inputs.configuration }} \
          --base-href "${{ inputs.base-href }}"

    - name: Verify build output
      if: inputs.publish == 'true'
      shell: bash
      run: |
        echo "Checking Angular build output..."
        ls -la frontend/bds-admin-ui/dist/bds-admin-ui/browser
        test -f frontend/bds-admin-ui/dist/bds-admin-ui/browser/index.html

    - name: Upload GitHub Pages artifact
      if: inputs.publish == 'true'
      uses: actions/upload-pages-artifact@v5
      with:
        name: github-pages
        path: frontend/bds-admin-ui/dist/bds-admin-ui/browser
